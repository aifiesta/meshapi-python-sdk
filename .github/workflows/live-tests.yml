# Python SDK — Live Tests

name: Live Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:            # run on PRs to any base (feature-branch stacks included)
  workflow_dispatch:
  schedule:
    # Staging canary (MESH-368). The MESHAPI_* secrets already point at staging,
    # so these runs exercise the live staging API on a fixed cadence — independent
    # of whether anyone opened a PR. Two cadences:
    - cron: "23 */2 * * *"   # every 2h — cheap smoke subset (fast outage detection)
    - cron: "0 7 * * *"      # daily 07:00 UTC — full live suite

env:
  # Secrets (set in repo → Settings → Secrets and variables → Actions → Secrets)
  MESHAPI_BASE_URL: ${{ secrets.MESHAPI_BASE_URL }}
  MESHAPI_TOKEN: ${{ secrets.MESHAPI_TOKEN }}
  # Core models — safe non-secret defaults.
  MESHAPI_MODEL: "openai/gpt-4o-mini"
  MESHAPI_EMBEDDINGS_MODEL: "openai/text-embedding-3-small"
  MESHAPI_SECOND_MODEL: "anthropic/claude-haiku-4.5"
  MESHAPI_REALTIME_MODEL: "openai/gpt-realtime-mini"
  MESHAPI_IMAGE_URL: "https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg"
  # Feature models — inlined (non-secret). Video generation is intentionally
  # left unset (skips: too costly to run in CI). Strict mode is off.
  MESHAPI_IMAGE_GEN_MODEL: "openai/gpt-image-1"
  MESHAPI_IMAGE_EDIT_MODEL: "openai/gpt-image-1"
  MESHAPI_AUDIO_OUT_MODEL: "openai/gpt-audio-mini"
  # Audio *input* (multimodal chat) needs a real recorded clip — a synthetic
  # tone is rejected as invalid audio. Audio round-trip is already covered by
  # the TTS→STT chained test, so MESHAPI_INPUT_AUDIO_B64 is left unset (that one
  # multimodal-audio-input case skips). Set it to a real base64 wav to enable.

jobs:
  live-test:
    name: Python SDK Live Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SDK source (including tests)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: livetests
        run: pip install -r requirements.txt

      # Smoke = fast subset run by the 2-hourly staging canary (models list, one
      # chat, embeddings/responses, one stream, 401/404). Every other trigger
      # (push, PR, manual, daily cron) runs the full suite — PR behavior unchanged.
      - name: Determine suite mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "23 */2 * * *" ]; then
            echo "value=smoke" >> "$GITHUB_OUTPUT"
          else
            echo "value=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Run live tests (${{ steps.mode.outputs.value }})
        working-directory: livetests
        run: |
          if [ "${{ steps.mode.outputs.value }}" = "smoke" ]; then
            pytest test_models.py test_chat.py test_inference_resources.py test_stream.py test_errors.py -v --tb=short
          else
            pytest . -v --tb=short
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## 🐍 Python SDK Live Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }}${{ github.event.schedule && format(' (`{0}`)', github.event.schedule) || '' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | ${{ steps.mode.outputs.value }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | 3.12 |" >> $GITHUB_STEP_SUMMARY
          echo "| Base URL | \`${{ env.MESHAPI_BASE_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Model | \`${{ env.MESHAPI_MODEL }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a  # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ *Python SDK Live Tests* — ${{ job.status }} · ${{ steps.mode.outputs.value }} suite\nTrigger: `${{ github.event_name }}${{ github.event.schedule && format(' {0}', github.event.schedule) || '' }}` · Base URL: `${{ env.MESHAPI_BASE_URL }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run> · ${{ github.head_ref || github.ref_name }}"
            }
